# Release (D-149). A vX.Y.Z tag builds and checks the .deb, the RPM and the Windows
# installer. It creates the GitHub release with the .deb and the installer, updates the
# signed apt repository on GitHub Pages (D-145), and makes the winget manifests (D-152).
# Copr builds the published RPM through its own webhook (D-144). Started by hand, the
# workflow only builds and checks both packages, and publishes nothing.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  deb:
    name: .deb (Ubuntu 24.04)
    # The oldest supported Ubuntu, so the package also runs on 26.04 (D-146).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/check-version.sh "$TAG"
      # The runner's own rustup, not a third-party action: this job builds what is
      # published.
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: sudo scripts/install-build-deps.sh && sudo apt-get install -y dpkg-dev
      - run: cargo build --release --locked -p rustbot-creator
      - name: Third-party licenses
        run: |
          cargo metadata --format-version 1 --locked \
            --filter-platform x86_64-unknown-linux-gnu \
            | python3 -I packaging/third-party-licenses.py > THIRD-PARTY-LICENSES.txt
      - name: Build the .deb
        id: deb
        # An assignment of its own, so a failing script fails the step.
        run: |
          deb=$(packaging/deb/build-deb.sh)
          echo "path=$deb" >> "$GITHUB_OUTPUT"
      - name: Install it and start the launcher
        env:
          DEB: ${{ steps.deb.outputs.path }}
        run: |
          test -f "$DEB"
          sudo apt-get install -y "$DEB"
          dpkg-deb --info "$DEB"
          # Without a display: a wrong project ID stops the hosted bot's launcher with 78.
          rustbot-creator --host not-a-uuid bot || test $? -eq 78
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/deb/*.deb
          if-no-files-found: error

  rpm:
    name: RPM (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
    steps:
      - run: dnf install -y git make tar rpm-build dnf-plugins-core
      - uses: actions/checkout@v7
      # The same steps as Copr: the SRPM from .copr/Makefile, then a build with network.
      - run: make -f .copr/Makefile srpm outdir="$PWD/srpm"
      - run: dnf builddep -y srpm/*.src.rpm
      - run: rpmbuild --rebuild --define "_rpmdir $PWD/rpm" srpm/*.src.rpm
      - name: Install it and start the launcher
        run: |
          dnf install -y rpm/x86_64/*.rpm
          rpm -q --requires rustbot-creator
          rustbot-creator --host not-a-uuid bot || test $? -eq 78
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-fedora-${{ matrix.fedora }}
          path: rpm/x86_64/*.rpm
          if-no-files-found: error

  windows:
    name: Installer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Git Bash would turn the installer compiler's "/D..." options into paths.
      MSYS_NO_PATHCONV: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/check-version.sh "$TAG"
      # The runner's own rustup, not a third-party action: this job builds what is
      # published.
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo build --release --locked -p rustbot-creator
      - name: Third-party licenses
        run: |
          cargo metadata --format-version 1 --locked \
            --filter-platform x86_64-pc-windows-msvc \
            | python -I packaging/third-party-licenses.py > THIRD-PARTY-LICENSES.txt
      - name: Build the installer
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress; fi
          "$iscc" "/DAppVersion=$version" packaging/windows/rustbot-creator.iss
      - name: Install it, start the launcher and uninstall it
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/windows/*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $folder = "$env:LOCALAPPDATA\Programs\RustBot Creator"
          if (!(Test-Path "$folder\rustbot-creator.exe")) { throw 'The app was not installed.' }
          # Without a display: a wrong project ID stops the hosted bot's launcher with 78.
          $launcher = Start-Process -FilePath "$folder\rustbot-creator.exe" -Wait -PassThru `
            -ArgumentList '--host', 'not-a-uuid', 'bot'
          if ($launcher.ExitCode -ne 78) { throw "The launcher exited with $($launcher.ExitCode)." }
          Start-Process -FilePath "$folder\unins000.exe" -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/windows/*.exe
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [deb, rpm, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Create the GitHub release
        run: |
          gh release create "$TAG" dist/*.deb dist/*.exe --prerelease \
            --title "RustBot Creator ${TAG#v} (pre-alpha)" \
            --notes-file packaging/release-notes.md
      - name: Import the apt signing key
        id: key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          printf '%s\n' "$APT_GPG_KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Update the apt repository on GitHub Pages
        env:
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        run: |
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
          packaging/apt/update-repo.sh site "$FINGERPRINT" dist/*.deb
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: rustbot-creator ${TAG#v}"
          git push origin gh-pages
      - name: Make the winget manifests
        run: |
          setup=$(basename dist/*.exe)
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$setup"
          sha256=$(sha256sum "dist/$setup" | cut -d ' ' -f 1)
          packaging/windows/winget/make-manifests.sh "${TAG#v}" "$url" "$sha256" winget
      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: winget
          if-no-files-found: error
