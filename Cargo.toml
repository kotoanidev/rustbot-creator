[workspace]
resolver = "3"
members = ["crates/*"]

# Shared package metadata. Every crate inherits these with `<field>.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kotoanidev/rustbot-creator"
# Nothing is published yet; the plugin SDK will be the first (D-029).
publish = false

# Shared dependency versions. Crates reference these with `dep.workspace = true`.
# Every dependency needs the owner's approval (D-006); the slice's set is D-041.
[workspace.dependencies]
# The UI framework (D-011).
gpui-kit = "0.10.0"
# The project format (D-019, D-051).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
# The project id (D-050).
uuid = { version = "1.29.3", features = ["v4", "serde"] }
# Typed errors in library crates.
thiserror = "2.0.21"
# Generating bots' Rust code as tokens, formatted without rustfmt (D-058).
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }
prettyplease = "0.3.0"
# The private toolchain (D-017): XDG paths, and downloading rustup-init with its checksum.
directories = "6.0.0"
ureq = "3.5.2"
sha2 = "0.11.1"
# Tests only.
tempfile = "3.27.0"
insta = "1.49.0"

# D-046.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
